const mae = (k) => {
  const r = DATA.rows.filter(d => d[k] != null && d.actual != null);
  return r.length ? (r.reduce((s, d) => s + Math.abs(d[k] - d.actual), 0) / r.length).toFixed(1) : "–";
};
document.getElementById("sub").textContent =
  `Updated ${DATA.updated} · MAE so far: my model $${mae("model")}, AEMO pre-dispatch $${mae("aemo")}`;

const line = (rows, label, key, color, dash) => ({
  label, borderColor: color, backgroundColor: color, borderWidth: 2, borderDash: dash || [],
  pointRadius: 0, tension: 0.2, spanGaps: false,
  data: rows.map(d => d[key]),
});

const chart = new Chart(document.getElementById("c"), {
  type: "line",
  data: { labels: [], datasets: [] },
  options: {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: { position: "top", labels: { boxWidth: 14, boxHeight: 2 } },
      tooltip: { callbacks: { label: c => c.raw == null ? null : `${c.dataset.label}: $${c.raw.toFixed(2)}` } },
    },
    scales: {
      x: { ticks: { maxTicksLimit: 12, maxRotation: 0, callback(v) { const s = this.getLabelForValue(v); return s.slice(5, 10) + " " + s.slice(11); } },
           grid: { color: "#eee" } },
      y: { title: { display: true, text: "$/MWh" }, grid: { color: "#eee" } },
    },
  },
});

function show(days) {
  const rows = days ? DATA.rows.slice(-48 * days) : DATA.rows;
  chart.data.labels = rows.map(d => d.t);
  chart.data.datasets = [
    line(rows, "Actual", "actual", "#111111"),
    line(rows, "My model (hybrid)", "model", "#2563eb"),
    line(rows, "AEMO pre-dispatch", "aemo", "#ea580c", [6, 4]),
  ];
  chart.update();
  document.querySelectorAll(".btns button").forEach(b => b.classList.toggle("on", +b.dataset.days === days));
}
document.querySelectorAll(".btns button").forEach(b => b.onclick = () => show(+b.dataset.days));
show(2);
